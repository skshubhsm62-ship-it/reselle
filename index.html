<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome — Rohan Mods Portal</title>
<meta http-equiv="refresh" content="3;url=login.php">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4efe4; --card:#fbf7ef; --border:#e6ddc8;
  --text:#000; --muted:#5b6472; --gold:#10d598; --gold-dark:#0aa478;
  --cyan:#ffb020;
}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 800px 500px at 50% -10%, rgba(16,213,152,.16), transparent 60%),var(--bg);
  font-family:'Segoe UI',Roboto,sans-serif;color:var(--text);
}
.box{text-align:center;padding:32px;max-width:420px}
.logo{
  width:104px;height:104px;margin:0 auto 26px;border-radius:28px;
  background:linear-gradient(155deg,#12261f,#050f0c 70%);
  border:1px solid rgba(16,213,152,.45);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 50px -12px rgba(16,213,152,.5);
  font-size:44px;
}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}
h1{font-size:24px;text-transform:uppercase;line-height:1.35;margin-bottom:10px}
h1 span{background:linear-gradient(90deg,var(--gold),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:13.5px;color:var(--muted);margin-bottom:30px}
.loader{width:180px;height:4px;margin:0 auto;border-radius:99px;background:var(--border);overflow:hidden}
.loader-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan));animation:load 2.9s ease-in-out forwards}
@keyframes load{0%{width:0%}100%{width:100%}}
.note{margin-top:16px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);opacity:.75}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🎮</div>
  <div class="eyebrow">🔐 Secure Access</div>
  <h1>Welcome To<br><span>Rohan Mods Portal</span></h1>
  <div class="tag">Loading, redirecting to sign in…</div>
  <div class="loader"><div class="loader-bar"></div></div>
  <div class="note">Redirecting automatically</div>
</div>
<script>setTimeout(function(){window.location.href="login.php";},2900);</script>
</body>
  </html>
